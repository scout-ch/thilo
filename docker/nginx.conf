server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # astro.config.mjs sets build.format: 'file', so every route is <route>.html
    # (not <route>/index.html) - no SPA fallback needed, each route is a real
    # file. Routes are requested without the extension, so they never reach the
    # regex blocks below and take their caching from here.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json image/svg+xml;

    # The service worker bootstraps every other cached file, so no browser or
    # CDN may hold on to it: a stale copy keeps importing the hashed workbox
    # chunk that the next deploy deletes, and then dies on a 404. Must stay
    # ahead of the asset block, which would otherwise claim it as a .js file.
    # Matched by regex rather than exactly, so a proxy that keeps a path prefix
    # (/thilo/sw.js) is covered too.
    location ~* /sw\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Payloads whose names survive a deploy but whose contents don't
    location ~* \.(html|json|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything left is content-hashed by the build and safe to keep forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
